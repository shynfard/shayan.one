apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shayan-one
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [shayan.one]
      secretName: shayan-one-tls
  rules:
    - host: shayan.one
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shayan-one
                port: { number: 80 }
